<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" type="image/png" href="assets/img/favicon.png">
    <title>Home</title>

    <script type="text/javascript"
        src="assets/js/jquery-3.7.1.min.js">
    </script>
    <script src="assets/js/navigation.js" defer></script>
    <script src="assets/js/name-water.js" defer></script>

  </head>
  <body>

    <div class=wrap>

      <section class="name-window" aria-labelledby="home-name">
        <header class="site-header">
          <nav class="topnav" id="movenavbar" aria-label="Main navigation"></nav>
          <button type="button" id="navhider" aria-label="Toggle navigation" aria-controls="movenavbar" aria-expanded="true">
            <img class="navarrow" src="assets/img/uparrow.png" alt="">
          </button>
        </header>
        <h1 id="home-name"><span class="name-letters">Weston Battles</span><i class="name-baseline" aria-hidden="true"></i></h1>
        <canvas class="name-water" aria-hidden="true"></canvas>
        <button type="button" class="water-toggle" hidden aria-label="Water mode" aria-pressed="false" title="Turn the name into water">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.8c-1.8 3.2-7 8.4-7 12a7 7 0 0 0 14 0c0-3.6-5.2-8.8-7-12Z"/>
            <path d="M8.5 15.2a3.6 3.6 0 0 0 3.1 3.4"/>
          </svg>
        </button>
      </section>

      <!-- Everything inside the dark-gray box of the website goes here -->
      <div class="graybox" id="graybox">



      </div>

    </div>


  </body>
</html>
